
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Supplier RFQ Inbox | Rolling Mill World</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="nav wrap">
      <a class="brand" href="index.html"><b>RMW</b> Rolling Mill <em>World</em></a>
      <nav>
        <a href="index.html">Home</a>
        <a href="directory.html">Suppliers</a>
      </nav>
      <a class="btn dark" href="index.html">Home</a>
    </div>
  </header>

  <main class="section wrap">
    <label>SUPPLIER DASHBOARD</label>
    <h1>RFQ Inbox</h1>
    <p>View buyer requirements assigned to your company.</p>
    <div id="inboxMessage" role="status">Loading your RFQs…</div>
    <div id="rfqList"></div>
  </main>

  <footer>
    <div class="wrap"><small>© 2026 Rolling Mill World</small></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    const escapeHtml = value => String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

    async function loadSupplierRfqs() {
      const message = document.getElementById('inboxMessage');
      const list = document.getElementById('rfqList');

      try {
        if (typeof getSupabaseClient !== 'function') {
          throw new Error('Supabase configuration did not load.');
        }

        const sb = await getSupabaseClient();
        const { data: sessionData, error: sessionError } =
          await sb.auth.getSession();

        if (sessionError) throw sessionError;

        if (!sessionData.session) {
          message.textContent =
            'Please sign in with the account that owns your supplier company.';
          return;
        }

        const user = sessionData.session.user;

        const { data: companies, error: companyError } = await sb
          .from('companies')
          .select('id, company_name')
          .eq('owner_id', user.id)
          .eq('company_type', 'supplier');

        if (companyError) throw companyError;

        if (!companies || companies.length === 0) {
          message.textContent =
            'No supplier company is linked to this account yet. Sign in with the account that registered your supplier profile.';
          return;
        }

        const companyIds = companies.map(company => company.id);

        const { data: rfqs, error: rfqError } = await sb
          .from('rfqs')
          .select('id, title, description, status, delivery_country, created_at, supplier_id, company_id')
          .or(
            'supplier_id.in.(' + companyIds.join(',') + '),' +
            'company_id.in.(' + companyIds.join(',') + ')'
          )
          .order('created_at', { ascending: false });

        if (rfqError) throw rfqError;

        if (!rfqs || rfqs.length === 0) {
          message.textContent =
            'No RFQs have been assigned to your company yet.';
          return;
        }

        message.textContent = rfqs.length +
          (rfqs.length === 1 ? ' assigned RFQ' : ' assigned RFQs');

        list.innerHTML = rfqs.map(rfq => {
          // Use only a company owned by the signed-in supplier.
          const assignedCompanyId = companyIds.find(id =>
            id === rfq.supplier_id || id === rfq.company_id
          );

          return `
            <article class="supplier" style="margin-top:16px;padding:20px;">
              <h3>${escapeHtml(rfq.title || 'Rolling mill requirement')}</h3>
              <p>${escapeHtml(rfq.description || 'No additional details provided.')}</p>
              <p><strong>Delivery country:</strong>
                ${escapeHtml(rfq.delivery_country || 'Not specified')}</p>
              <p><strong>Status:</strong>
                ${escapeHtml(rfq.status || 'open')}</p>
              <p><strong>Received:</strong>
                ${rfq.created_at
                  ? escapeHtml(new Date(rfq.created_at).toLocaleDateString())
                  : 'Not available'}</p>
              <p><strong>Reference:</strong> ${escapeHtml(rfq.id)}</p>

              ${assignedCompanyId ? `
                <form class="quotation-form"
                  data-rfq-id="${escapeHtml(rfq.id)}"
                  data-supplier-company-id="${escapeHtml(assignedCompanyId)}"
                  style="margin-top:16px;padding-top:16px;border-top:1px solid #ddd;">

                  <h4>Submit Quotation</h4>

                  <label>Price *</label>
                  <input name="price" type="number" min="0"
                    step="0.01" required placeholder="Enter your total price">

                  <label>Currency *</label>
                  <select name="currency" required>
                    <option value="">Select currency</option>
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                    <option value="INR">INR</option>
                    <option value="AED">AED</option>
                  </select>

                  <label>Delivery time</label>
                  <input name="delivery_time" type="text"
                    placeholder="e.g. 8–10 weeks">

                  <label>Payment terms</label>
                  <input name="payment_terms" type="text"
                    placeholder="e.g. 30% advance, 70% before shipment">

                  <label>Warranty</label>
                  <input name="warranty" type="text"
                    placeholder="e.g. 12 months">

                  <label>Notes</label>
                  <textarea name="notes" rows="3"
                    placeholder="Additional quotation details"></textarea>

                  <button type="submit">Submit Quotation</button>
                  <p class="quotation-message" role="status"
                    aria-live="polite"></p>
                </form>
              ` : `
                <p>Quotation submission is unavailable because this RFQ
                  has no matching supplier assignment.</p>
              `}
            </article>
          `;
        }).join('');

        // One delegated listener handles every quotation form.
        list.addEventListener('submit', async event => {
          const form = event.target;

          if (!form.matches('.quotation-form')) return;
          event.preventDefault();

          const button = form.querySelector('button[type="submit"]');
          const formMessage = form.querySelector('.quotation-message');
          const formData = new FormData(form);

          const rfqId = form.dataset.rfqId;
          const supplierCompanyId = form.dataset.supplierCompanyId;
          const rawPrice = String(formData.get('price') || '').trim();
          const price = Number(rawPrice);
          const currency = String(formData.get('currency') || '').trim();

          if (!rawPrice || !Number.isFinite(price) ||
              price < 0 || !currency) {
            formMessage.textContent =
              'Enter a valid price and select a currency.';
            return;
          }

          button.disabled = true;
          formMessage.textContent = 'Submitting quotation...';

          try {
            const { data: existing, error: checkError } = await sb
              .from('quotations')
              .select('id')
              .eq('rfq_id', rfqId)
              .eq('supplier_company_id', supplierCompanyId)
              .limit(1);

            if (checkError) throw checkError;

            if (existing && existing.length > 0) {
              formMessage.textContent =
                'Your company has already submitted a quotation for this RFQ.';
              return;
            }

            const { error: insertError } = await sb
              .from('quotations')
              .insert({
                rfq_id: rfqId,
                supplier_company_id: supplierCompanyId,
                price,
                currency,
                delivery_time:
                  String(formData.get('delivery_time') || '').trim() || null,
                payment_terms:
                  String(formData.get('payment_terms') || '').trim() || null,
                warranty:
                  String(formData.get('warranty') || '').trim() || null,
                notes:
                  String(formData.get('notes') || '').trim() || null,
                status: 'submitted'
              });

            if (insertError) throw insertError;

            formMessage.textContent = 'Quotation submitted successfully!';
            form.reset();
          } catch (error) {
            console.error('Quotation submission error:', error);
            formMessage.textContent =
              'Submission failed: ' + (error.message || 'Please try again.');
          } finally {
            button.disabled = false;
          }
        });

      } catch (error) {
        console.error('Supplier RFQ inbox error:', error);
        message.textContent =
          'Could not load RFQs: ' + (error.message || 'Unknown error');
      }
    }

    document.addEventListener('DOMContentLoaded', loadSupplierRfqs);
  </script>
</body>
</html>
