<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="app.js"></script>

<script src="auth.js"></script>

<script>
document.addEventListener('DOMContentLoaded', async () => {

  const msg = document.getElementById('supplierMsg');
  const list = document.getElementById('rfqList');

  try {

    if (list) {
      list.innerHTML = '<p>Connecting to Supabase…</p>';
    }

    const sb = await getSupabaseClient();

    if (list) {
      list.innerHTML = '<p>Checking your sign-in…</p>';
    }

    const {
      data: sessionData,
      error: sessionError
    } = await sb.auth.getSession();

    if (sessionError) {
      throw new Error(
        'Session error: ' + sessionError.message
      );
    }

    if (!sessionData.session || !sessionData.session.user) {

      if (msg) {
        msg.textContent =
          'You are not signed in.';
      }

      if (list) {
        list.innerHTML =
          '<p>Please sign in first, then refresh this page.</p>';
      }

      return;
    }

    if (list) {
      list.innerHTML = '<p>Loading open RFQs from Supabase…</p>';
    }

    const { data: rfqs, error: rfqError } = await sb
      .from('rfqs')
      .select(
        'id, title, description, status, delivery_country, created_at'
      )
      .eq('status', 'open')
      .order('created_at', { ascending: false });

    if (rfqError) {
      throw new Error(
        'RFQ database error: ' + rfqError.message
      );
    }

    if (!rfqs) {
      throw new Error(
        'Supabase returned no RFQ data.'
      );
    }

    if (rfqs.length === 0) {

      if (list) {
        list.innerHTML =
          '<p>Supabase connected successfully, but there are no open RFQs.</p>';
      }

      return;
    }

    if (list) {

      list.innerHTML = rfqs.map(rfq => {

        const date = new Date(rfq.created_at)
          .toLocaleDateString();

        return `
          <article
            class="card"
            style="margin-top:20px; padding:24px;"
          >

            <small>RFQ REFERENCE</small>

            <h2>
              ${escapeHtml(rfq.title || 'Buyer RFQ')}
            </h2>

            <p>
              ${escapeHtml(
                rfq.description || 'No description provided.'
              )}
            </p>

            ${
              rfq.delivery_country
                ? `
                  <p>
                    <strong>Delivery country:</strong>
                    ${escapeHtml(rfq.delivery_country)}
                  </p>
                `
                : ''
            }

            <p>
              <strong>Status:</strong>
              ${escapeHtml(rfq.status)}
            </p>

            <p>
              <strong>Submitted:</strong>
              ${date}
            </p>

            <p>
              <small>
                Reference: ${escapeHtml(rfq.id)}
              </small>
            </p>

            <button
              class="btn blue"
              type="button"
              onclick="toggleQuotationForm('${rfq.id}')"
            >
              View RFQ / Submit quotation
            </button>

            <div
              id="quotationForm-${rfq.id}"
              style="display:none; margin-top:24px;"
            >

              <hr>

              <h3>Submit your quotation</h3>

              <form
                onsubmit="submitQuotation(event, '${rfq.id}')"
              >

                <input
                  id="price-${rfq.id}"
                  type="number"
                  step="0.01"
                  min="0"
                  required
                  placeholder="Price"
                >

                <select
                  id="currency-${rfq.id}"
                  required
                >
                  <option value="">Select currency</option>
                  <option value="USD">USD</option>
                  <option value="EUR">EUR</option>
                  <option value="INR">INR</option>
                  <option value="GBP">GBP</option>
                  <option value="AED">AED</option>
                  <option value="CNY">CNY</option>
                </select>

                <input
                  id="delivery-${rfq.id}"
                  required
                  placeholder="Delivery time (e.g. 12 weeks)"
                >

                <input
                  id="payment-${rfq.id}"
                  required
                  placeholder="Payment terms"
                >

                <input
                  id="warranty-${rfq.id}"
                  placeholder="Warranty"
                >

                <textarea
                  id="notes-${rfq.id}"
                  rows="5"
                  placeholder="Additional notes / quotation details"
                ></textarea>

```
            <button
              class="btn blue"
              type="submit"
              id="submitQuotation-${rfq.id}"
            >
              Submit quotation
            </button>

            <p id="quotationMsg-${rfq.id}"></p>

          </form>

        </div>

      </article>
    `;

  }).join('');
}
```

} catch (err) {

```
console.error(
  'Supplier dashboard error:',
  err
);

if (msg) {
  msg.textContent =
    err.message || 'Unknown error.';
}

if (list) {
  list.innerHTML =
    '<p>The dashboard could not load the RFQs.</p>';
}
```

}

});

function toggleQuotationForm(rfqId) {

const form = document.getElementById(
'quotationForm-' + rfqId
);

if (!form) return;

form.style.display =
form.style.display === 'none'
? 'block'
: 'none';
}

async function submitQuotation(event, rfqId) {

event.preventDefault();

const button = document.getElementById(
'submitQuotation-' + rfqId
);

const msg = document.getElementById(
'quotationMsg-' + rfqId
);

if (msg) {
msg.textContent = 'Submitting quotation…';
}

if (button) {
button.disabled = true;
}

try {

```
const sb = await getSupabaseClient();

const {
  data: sessionData,
  error: sessionError
} = await sb.auth.getSession();

if (sessionError) {
  throw sessionError;
}

if (!sessionData.session || !sessionData.session.user) {
  throw new Error(
    'Please sign in before submitting a quotation.'
  );
}

const user = sessionData.session.user;

const {
  data: company,
  error: companyError
} = await sb
  .from('companies')
  .select('id')
  .eq('owner_id', user.id)
  .limit(1)
  .maybeSingle();

if (companyError) {
  throw companyError;
}

if (!company) {
  throw new Error(
    'Supplier company profile not found.'
  );
}

const price = document.getElementById(
  'price-' + rfqId
).value;

const currency = document.getElementById(
  'currency-' + rfqId
).value;

const deliveryTime = document.getElementById(
  'delivery-' + rfqId
).value.trim();

const paymentTerms = document.getElementById(
  'payment-' + rfqId
).value.trim();

const warranty = document.getElementById(
  'warranty-' + rfqId
).value.trim();

const notes = document.getElementById(
  'notes-' + rfqId
).value.trim();

const { error } = await sb
  .from('quotations')
  .insert({
    rfq_id: rfqId,
    supplier_company_id: company.id,
    price: Number(price),
    currency: currency,
    delivery_time: deliveryTime,
    payment_terms: paymentTerms,
    warranty: warranty,
    notes: notes,
    status: 'submitted'
  });

if (error) {
  throw error;
}

if (msg) {
  msg.textContent =
    'Quotation submitted successfully.';
}

event.target.reset();

if (button) {
  button.disabled = false;
}
```

} catch (err) {

```
console.error(
  'Quotation submission failed:',
  err
);

if (msg) {
  msg.textContent =
    err.message ||
    'Could not submit quotation.';
}

if (button) {
  button.disabled = false;
}
```

}
}

function escapeHtml(value) {

return String(value)
.replace(/&/g, '&')
.replace(/</g, '<')
.replace(/>/g, '>')
.replace(/"/g, '"')
.replace(/'/g, ''');

} </script>
