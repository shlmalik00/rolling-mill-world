
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supplier Dashboard | Rolling Mill World</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <div class="nav wrap">
    <a class="brand" href="index.html">
      <b>RMW</b> Rolling Mill <em>World</em>
    </a>

    <nav>
      <a href="directory.html">Suppliers</a>
      <a href="index.html#categories">Categories</a>
      <a href="supplier-dashboard.html">Supplier Dashboard</a>
    </nav>

    <a class="btn dark" href="index.html">Home</a>
  </div>
</header>

<main class="section wrap">

  <label>SUPPLIER DASHBOARD</label>
  <h1>Incoming Buyer RFQs</h1>

  <p>
    Review requests sent to your company and submit your quotation.
  </p>

  <div id="supplierMsg" role="status" aria-live="polite"></div>

  <div id="rfqList">
    <p>Starting dashboard…</p>
  </div>

</main>

<footer>
  <div class="wrap">
    <small>© 2026 Rolling Mill World</small>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script src="auth.js"></script>

<script>
let supplierCompanyId = null;

document.addEventListener('DOMContentLoaded', loadSupplierDashboard);

async function loadSupplierDashboard() {
  const msg = document.getElementById('supplierMsg');
  const list = document.getElementById('rfqList');

  try {
    list.innerHTML = '<p>Connecting to Supabase…</p>';

    if (typeof getSupabaseClient !== 'function') {
      throw new Error('Authentication system is not available.');
    }

    const sb = await getSupabaseClient();

    const {
      data: sessionData,
      error: sessionError
    } = await sb.auth.getSession();

    if (sessionError) {
      throw new Error('Session error: ' + sessionError.message);
    }

    if (!sessionData.session?.user) {
      msg.innerHTML = `
        <p>You need to sign in to access your supplier dashboard.</p>
        <button class="btn blue" type="button" onclick="signInToDashboard()">
          Supplier Login
        </button>
      `;

      list.innerHTML = '';
      return;
    }

    const user = sessionData.session.user;

    list.innerHTML = '<p>Loading your supplier company…</p>';

    const {
      data: company,
      error: companyError
    } = await sb
      .from('companies')
      .select('id')
      .eq('owner_id', user.id)
      .limit(1)
      .maybeSingle();

    if (companyError) {
      throw new Error(
        'Could not load your supplier company: ' + companyError.message
      );
    }

    if (!company) {
      msg.textContent =
        'No supplier company profile was found for this account. Please register or check your supplier account.';
      list.innerHTML = '';
      return;
    }

    supplierCompanyId = company.id;

    msg.textContent = '';
    list.innerHTML = '<p>Loading RFQs addressed to your company…</p>';

    const {
      data: rfqs,
      error: rfqError
    } = await sb
      .from('rfqs')
      .select(
        'id, title, description, status, delivery_country, created_at'
      )
      .eq('supplier_id', supplierCompanyId)
      .eq('status', 'open')
      .order('created_at', { ascending: false });

    if (rfqError) {
      throw new Error(
        'Could not load incoming RFQs: ' + rfqError.message
      );
    }

    if (!rfqs || rfqs.length === 0) {
      list.innerHTML = `
        <article class="card" style="margin-top:20px;padding:24px;">
          <h2>No incoming RFQs yet</h2>
          <p>
            When a buyer sends an RFQ to your company, it will appear here.
          </p>
        </article>
      `;
      return;
    }

    list.innerHTML = rfqs.map(function (rfq) {
      const date = rfq.created_at
        ? new Date(rfq.created_at).toLocaleDateString()
        : 'Not available';

      const id = escapeHtml(rfq.id);

      return `
        <article class="card" style="margin-top:20px;padding:24px;">
          <small>RFQ REFERENCE</small>

          <h2>${escapeHtml(rfq.title || 'Buyer RFQ')}</h2>

          <p>${escapeHtml(
            rfq.description || 'No description provided.'
          )}</p>

          ${
            rfq.delivery_country
              ? `<p><strong>Delivery country:</strong>
                  ${escapeHtml(rfq.delivery_country)}</p>`
              : ''
          }

          <p><strong>Status:</strong> ${escapeHtml(rfq.status)}</p>
          <p><strong>Submitted:</strong> ${escapeHtml(date)}</p>

          <p>
            <small>Reference: ${id}</small>
          </p>

          <button
            class="btn blue"
            type="button"
            onclick="toggleQuotationForm('${id}')"
          >
            View RFQ / Submit quotation
          </button>

          <div
            id="quotationForm-${id}"
            style="display:none;margin-top:24px;"
          >
            <hr>
            <h3>Submit your quotation</h3>

            <form onsubmit="submitQuotation(event, '${id}')">

              <label for="price-${id}">Price</label>
              <input
                id="price-${id}"
                type="number"
                step="0.01"
                min="0"
                required
                placeholder="Price"
              >

              <label for="currency-${id}">Currency</label>
              <select id="currency-${id}" required>
                <option value="">Select currency</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="INR">INR</option>
                <option value="GBP">GBP</option>
                <option value="AED">AED</option>
                <option value="CNY">CNY</option>
              </select>

              <label for="delivery-${id}">Delivery time</label>
              <input
                id="delivery-${id}"
                required
                placeholder="Delivery time (e.g. 12 weeks)"
              >

              <label for="payment-${id}">Payment terms</label>
              <input
                id="payment-${id}"
                required
                placeholder="Payment terms"
              >

              <label for="warranty-${id}">Warranty</label>
              <input
                id="warranty-${id}"
                placeholder="Warranty"
              >

              <label for="notes-${id}">Additional details</label>
              <textarea
                id="notes-${id}"
                rows="5"
                placeholder="Additional notes / quotation details"
              ></textarea>

              <button
                class="btn blue"
                type="submit"
                id="submitQuotation-${id}"
              >
                Submit quotation
              </button>

              <p id="quotationMsg-${id}" role="status" aria-live="polite"></p>
            </form>
          </div>
        </article>
      `;
    }).join('');

  } catch (err) {
    console.error('Supplier dashboard error:', err);

    msg.textContent = err.message || 'An unexpected error occurred.';
    list.innerHTML = '<p>The dashboard could not load the RFQs.</p>';
  }
}

function signInToDashboard() {
  if (typeof openAuth === 'function') {
    openAuth('login');
  } else {
    window.location.href = 'index.html';
  }
}

function toggleQuotationForm(rfqId) {
  const form = document.getElementById('quotationForm-' + rfqId);

  if (!form) return;

  form.style.display =
    form.style.display === 'none' ? 'block' : 'none';
}

async function submitQuotation(event, rfqId) {
  event.preventDefault();

  const button = document.getElementById('submitQuotation-' + rfqId);
  const msg = document.getElementById('quotationMsg-' + rfqId);

  if (msg) msg.textContent = 'Submitting quotation…';
  if (button) button.disabled = true;

  try {
    const sb = await getSupabaseClient();

    const {
      data: sessionData,
      error: sessionError
    } = await sb.auth.getSession();

    if (sessionError) throw sessionError;

    if (!sessionData.session?.user) {
      throw new Error('Please sign in before submitting a quotation.');
    }

    const user = sessionData.session.user;

    const {
      data: company,
      error: companyError
    } = await sb
      .from('companies')
      .select('id')
      .eq('owner_id', user.id)
      .limit(1)
      .maybeSingle();

    if (companyError) throw companyError;

    if (!company) {
      throw new Error('Supplier company profile not found.');
    }

    // Confirm that this RFQ is assigned to this supplier.
    const {
      data: rfq,
      error: rfqError
    } = await sb
      .from('rfqs')
      .select('id')
      .eq('id', rfqId)
      .eq('supplier_id', company.id)
      .eq('status', 'open')
      .maybeSingle();

    if (rfqError) throw rfqError;

    if (!rfq) {
      throw new Error(
        'This RFQ is not assigned to your company or is no longer open.'
      );
    }

    const price = document.getElementById('price-' + rfqId).value;
    const currency = document.getElementById('currency-' + rfqId).value;
    const deliveryTime = document.getElementById('delivery-' + rfqId).value.trim();
    const paymentTerms = document.getElementById('payment-' + rfqId).value.trim();
    const warranty = document.getElementById('warranty-' + rfqId).value.trim();
    const notes = document.getElementById('notes-' + rfqId).value.trim();

    const { error } = await sb
      .from('quotations')
      .insert({
        rfq_id: rfqId,
        supplier_company_id: company.id,
        price: Number(price),
        currency: currency,
        delivery_time: deliveryTime,
        payment_terms: paymentTerms,
        warranty: warranty,
        notes: notes,
        status: 'submitted'
      });

    if (error) throw error;

    if (msg) {
      msg.textContent = 'Quotation submitted successfully.';
    }

    event.target.reset();

  } catch (err) {
    console.error('Quotation submission failed:', err);

    if (msg) {
      msg.textContent = err.message || 'Could not submit quotation.';
    }

  } finally {
    if (button) button.disabled = false;
  }
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
</script>

</body>
</html>
