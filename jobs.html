<body>

<header>

<a class="brand" href="index.html">

<main class="section wrap">

<label>RMW CAREERS</label>

  <h1>Find Jobs</h1>

  <p>
    Find rolling-mill, steel, machinery and industrial jobs from employers
    using Rolling Mill World.
  </p>

  <section class="card">


<div class="form-grid">

  <div>
    <label for="search">Search</label>
    <input
      id="search"
      type="text"
      placeholder="Job title, skill or keyword"
    >
  </div>

  <div>
    <label for="country">Country</label>
    <input
      id="country"
      type="text"
      placeholder="India, UAE, Saudi Arabia..."
    >
  </div>

  <div>
    <label for="location">Location</label>
    <input
      id="location"
      type="text"
      placeholder="City or location"
    >
  </div>

  <div>
    <label for="employmentType">Employment type</label>
    <select id="employmentType">
      <option value="">All types</option>
      <option value="Full-time">Full-time</option>
      <option value="Part-time">Part-time</option>
      <option value="Contract">Contract</option>
      <option value="Temporary">Temporary</option>
      <option value="Internship">Internship</option>
    </select>
  </div>

  <div>
    <label for="experience">Experience</label>
    <select id="experience">
      <option value="">Any experience</option>
      <option value="0">0–2 years</option>
      <option value="3">3–5 years</option>
      <option value="6">6–10 years</option>
      <option value="11">11+ years</option>
    </select>
  </div>

</div>

<button class="btn dark" type="button" id="searchJobs">
  Search Jobs
</button>

<button class="btn" type="button" id="clearFilters">
  Clear Filters
</button>


  </section>

  <div id="jobsCount"></div>

  <div id="jobsResults"></div>

</main>

<footer>
  <div class="wrap">
    <small>© 2026 Rolling Mill World</small>
  </div>

</body>
</html>
