<form id="supplierForm">
  <input id="supplierCompanyName" required placeholder="Company name">

  <input id="supplierEmail" required type="email" placeholder="Business email">

  <input id="supplierWebsite" placeholder="Website">

  <input id="supplierCountry" placeholder="Country">

  <select id="supplierType">
    <option>Manufacturer</option>
    <option>Supplier / Distributor</option>
    <option>Service Provider</option>
    <option>Engineering / EPC</option>
    <option>Used Machinery Seller</option>
  </select>

  <textarea
    id="supplierDescription"
    rows="5"
    placeholder="Products / capabilities"
  ></textarea>

  <button class="btn blue" type="submit">
    Create supplier profile
  </button>

  <small id="supplierMsg"></small>
</form>
