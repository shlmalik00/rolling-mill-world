<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manage RFQs | Rolling Mill World</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    .adminLayout{
      display:grid;
      grid-template-columns:240px 1fr;
      min-height:calc(100vh - 76px);
      background:#f5f8fa;
    }

    .adminSide{
      background:#142a3f;
      color:#fff;
      padding:25px 15px;
    }

    .adminSide h3{
      margin:0 10px 25px;
      font-size:18px;
    }

    .adminSide a{
      display:block;
      padding:11px 12px;
      margin:4px 0;
      border-radius:8px;
      color:#d8e2ea;
      font-size:14px;
    }

    .adminSide a:hover,
    .adminSide a.active{
      background:#1d405e;
      color:#fff;
    }

    .adminMain{
      padding:35px;
    }

    .adminHeader{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      margin-bottom:30px;
    }

    .adminHeader h1{
      margin:0;
      font-size:32px;
    }

    .adminHeader p{
      margin:5px 0 0;
      color:#68747e;
    }

    .rfqTable{
      background:#fff;
      border:1px solid #dfe6eb;
      border-radius:13px;
      overflow:hidden;
    }

    .rfqRow{
      display:grid;
      grid-template-columns:1.4fr 1.5fr 120px 130px 120px;
      gap:15px;
      padding:18px 20px;
      border-bottom:1px solid #e8edf1;
      align-items:center;
    }

    .rfqRow:last-child{
      border-bottom:0;
    }

    .rfqHead{
      background:#f5f8fa;
      font-weight:800;
      color:#53616c;
      font-size:13px;
    }

    .rfqRow strong{
      color:#142a3f;
    }

    .rfqRow small{
      color:#68747e;
    }

    .status{
      display:inline-block;
      padding:5px 9px;
      border-radius:999px;
      font-size:11px;
      font-weight:800;
      background:#edf5fc;
      color:#1476d2;
    }

    .emptyState{
      background:#fff;
      border:1px solid #dfe6eb;
      border-radius:13px;
      padding:30px;
      color:#68747e;
    }

    @media(max-width:900px){

      .adminLayout{
        grid-template-columns:1fr;
      }

      .adminSide{
        padding:15px;
      }

      .adminSide a{
        display:inline-block;
        margin:2px;
      }

      .adminMain{
        padding:25px;
      }

      .rfqRow{
        grid-template-columns:1fr 1fr;
      }

      .rfqHead{
        display:none;
      }
    }

    @media(max-width:520px){

      .adminMain{
        padding:20px;
      }

      .adminHeader{
        align-items:flex-start;
        flex-direction:column;
      }

      .rfqRow{
        grid-template-columns:1fr;
        gap:8px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="nav wrap">

    <a class="brand" href="index.html">
      <b>RMW</b> Rolling Mill <em>World</em>
    </a>

    <div class="navActions">

      <a class="btn light" href="admin.html">
        Dashboard
      </a>

      <a class="btn blue" href="index.html">
        View Website
      </a>

    </div>

  </div>
</header>


<div class="adminLayout">

  <aside class="adminSide">

    <h3>RMW Admin</h3>

    <a href="admin.html">
      Dashboard
    </a>

    <a href="admin-suppliers.html">
      Suppliers
    </a>

    <a class="active" href="admin-rfqs.html">
      RFQs
    </a>

    <a href="account.html">
      Quotations
    </a>

    <a href="account.html">
      Buyers
    </a>

    <a href="supplier.html">
      Supplier Accounts
    </a>

    <a href="about.html">
      Pages
    </a>

    <a href="index.html">
      Settings
    </a>

  </aside>


  <main class="adminMain">

    <div class="adminHeader">

      <div>
        <h1>RFQs</h1>
        <p>View buyer requirements submitted to Rolling Mill World.</p>
      </div>

      <a class="btn blue" href="index.html#rfq">
        View RFQ Form
      </a>

    </div>


    <div id="rfqResults">

      <div class="emptyState">
        Loading RFQs...
      </div>

    </div>

  </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>


<script>

async function checkAdminAccess() {

  try {

    const sb = await getSupabaseClient();

    const {
      data,
      error
    } = await sb.auth.getSession();

    if (
      error ||
      !data.session ||
      !data.session.user ||
      data.session.user.email !== 'shlmalik00@gmail.com'
    ) {

      window.location.href = 'index.html';

      return false;
    }

    return true;

  } catch (err) {

    console.error(
      'Admin access check failed:',
      err
    );

    window.location.href = 'index.html';

    return false;
  }
}


async function loadRfqs() {

  const allowed =
    await checkAdminAccess();

  if (!allowed) return;

  const results =
    document.getElementById('rfqResults');

  try {

    const sb =
      await getSupabaseClient();

    const {
      data,
      error
    } = await sb.rpc(
      'get_admin_rfqs'
    );

    if (error) throw error;


    if (!data || !data.length) {

      results.innerHTML = `
        <div class="emptyState">
          No RFQs have been submitted yet.
        </div>
      `;

      return;
    }


    results.innerHTML = `

      <div class="rfqTable">

        <div class="rfqRow rfqHead">

          <div>RFQ</div>
          <div>Description</div>
          <div>Status</div>
          <div>Country</div>
          <div>Quotations</div>

        </div>


        ${data.map(rfq => `

          <div class="rfqRow">

            <div>

              <strong>
                ${rfq.title || 'Untitled RFQ'}
              </strong>

              <br>

              <small>
                ${
                  rfq.created_at
                    ? new Date(
                        rfq.created_at
                      ).toLocaleDateString()
                    : '—'
                }
              </small>

            </div>


            <div>

              ${rfq.description || '—'}

            </div>


            <div>

              <span class="status">

                ${rfq.status || '—'}

              </span>

            </div>


            <div>

              ${rfq.delivery_country || '—'}

            </div>


            <div>

              <strong>
                ${rfq.quotation_count || 0}
              </strong>

            </div>

          </div>

        `).join('')}

      </div>

    `;

  } catch (err) {

    console.error(
      'Could not load RFQs:',
      err
    );

    results.innerHTML = `

      <div class="emptyState">

        Could not load RFQs.

      </div>

    `;
  }
}


loadRfqs();

</script>

</body>
</html>
